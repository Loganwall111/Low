# ============================================================================
#  Devouring Storms v5 - the Story Look lives IN the pack now.
#
#  This pack ships inside the mod jar and installs itself into shaderpacks/
#  on first launch (MCSM Control Panel -> "Built-in Shader Pack" toggle,
#  DEFAULT ON). It carries the same round-5 Story Mode sky the mod's core
#  shaders paint without Iris: the pastel EnderCon day, the pinkish-violet
#  storm skies (5.5-5.9), the layered cloud decks, the blue horizon rim,
#  the purple vault line and the shrunken overhead storm dome.
#
#  The clouds belong to the pack (user order: a shader pack must never
#  revert the clouds to vanilla) - gbuffers_clouds is an exact passthrough
#  and the Story Mode decks are painted by the sky pass itself.
#
#  Grading defaults are ON in v5: bloom, ACES tonemap, storm purple grade,
#  vignette, aurora and colourful lighting all ship enabled.
# ============================================================================

screen = [Sky] [Aurora] [Lighting] [Extra]

screen.Sky = SKY_STORY_MODE STORM_SKY SKY_SATURATION HORIZON_GLOW \
             BIOME_SKIES BIOME_STRENGTH

screen.Aurora = AURORA AURORA_STRENGTH AURORA_SPEED AURORA_HEIGHT AURORA_COVERAGE \
                AURORA_R AURORA_G AURORA_B AURORA_TIP_R AURORA_TIP_G AURORA_TIP_B

screen.Lighting = COLORED_LIGHT COLORED_LIGHT_AMT

screen.Extra = BLOOM BLOOM_STRENGTH VIBRANCE EXPOSURE CONTRAST TONEMAP \
               STORM_PURPLE_ON STORM_PURPLE STORM_VIGNETTE_ON STORM_VIGNETTE

sliders = SKY_SATURATION AURORA_STRENGTH AURORA_SPEED AURORA_HEIGHT AURORA_COVERAGE \
          AURORA_R AURORA_G AURORA_B AURORA_TIP_R AURORA_TIP_G AURORA_TIP_B \
          COLORED_LIGHT_AMT BLOOM_STRENGTH STORM_PURPLE STORM_VIGNETTE \
          VIBRANCE EXPOSURE CONTRAST BIOME_STRENGTH

# --- v5 defaults: the full Story Look, ON ---
option.SKY_STORY_MODE=true
option.STORM_SKY=true
option.BIOME_SKIES=true
option.AURORA=true
option.COLORED_LIGHT=true
option.BLOOM=true
option.TONEMAP=true
option.STORM_PURPLE_ON=true
option.STORM_VIGNETTE_ON=true
